name: Build
run-name: ${{ github.event.inputs.version }} Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v1.0.0)"
        required: true
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake -S src -B build -G "Ninja Multi-Config" -DOPENSTEAMTOOL_VERSION="${{ github.event.inputs.version }}"

      - name: Build Release
        run: cmake --build build --config Release

      - name: Build Debug
        run: cmake --build build --config Debug

      - uses: actions/upload-artifact@v4
        with:
          name: OpenSteamTool-Release
          path: build/Release/

      - uses: actions/upload-artifact@v4
        with:
          name: OpenSteamTool-Debug
          path: build/Debug/

      - name: Generate changelog
        id: changelog
        shell: bash
        run: |
          {
            echo 'changelog<<EOF'
            git log -1 --pretty=format:"- %s%n%b"
            echo ''
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - name: Create tag
        run: |
          git tag ${{ github.event.inputs.version }}
          git push origin ${{ github.event.inputs.version }}

      - name: Package Release
        run: 7z a OpenSteamTool-${{ github.event.inputs.version }}-Release.zip ".\build\Release\*" -mx5

      - name: Package Debug
        run: 7z a OpenSteamTool-${{ github.event.inputs.version }}-Debug.zip ".\build\Debug\*" -mx5

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          body: |
            ## 更新内容

            ${{ steps.changelog.outputs.changelog }}

            ## 安装方法

            下载 `OpenSteamTool-${{ github.event.inputs.version }}-Release.zip`（如需 `<steam>/opensteamtool` 目录下的运行日志，请下载 `-Debug` 版本）。

            解压并将 `version.dll`、`xinput1_4.dll` 和 `OpenSteamTool.dll` 复制到 Steam 根目录（例如 `C:\Program Files (x86)\Steam`）。

            如果你之前部署过 `dwmapi.dll`（Steam 根目录或 `bin` 目录），请将其删除——它已退役，残留会导致新版 Steam 启动失败（`VGUI_Setup failed`）。

            创建 Lua 配置目录（例如 `C:\Program Files (x86)\Steam\config\lua`）并将 Lua 脚本放在那里。**不要**放在 `C:\Program Files (x86)\Steam\config\stplug-in`！
          files: |
            OpenSteamTool-${{ github.event.inputs.version }}-Release.zip
            OpenSteamTool-${{ github.event.inputs.version }}-Debug.zip
